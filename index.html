<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Braille — Text to Braille Translator</title>
<meta name="description" content="Translate text to Braille and back. Grade 1 uncontracted Braille. Copy with one tap. Works offline.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --navy:#0f172a; --navy2:#1e293b;
  --ink:#1c1c1c; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--navy);color:#fff;padding:18px 20px;}
.hwrap{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.hwrap img{width:38px;height:38px;border-radius:9px;}
.hwrap h1{font-size:19px;font-weight:700;letter-spacing:.2px;}
.hwrap p{font-size:12px;color:#94a3b8;letter-spacing:.4px;}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:24px 20px 40px;}
.dir{display:flex;background:#e8edf3;border-radius:12px;padding:4px;margin-bottom:20px;}
.dir button{flex:1;border:none;background:transparent;padding:11px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
.dir button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(15,23,42,.12);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);}
.card label{display:block;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
textarea{width:100%;border:none;outline:none;resize:vertical;font:inherit;font-size:16px;color:var(--ink);background:transparent;min-height:96px;line-height:1.7;}
textarea::placeholder{color:#b6bfcc;}
.output{font-size:26px;letter-spacing:3px;line-height:2;word-break:break-all;min-height:96px;color:var(--navy);}
.output.empty{color:#b6bfcc;font-size:15px;letter-spacing:.3px;}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font:inherit;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy2);}
.btn:disabled{opacity:.45;cursor:default;}
.btn svg{flex-shrink:0;}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:20px;}
footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <img src="icons/icon-192.png" alt="Braille app icon">
    <div><h1>Braille</h1><p>TEXT ⇄ BRAILLE TRANSLATOR</p></div>
  </div>
</header>

<main>
  <div class="dir" role="tablist">
    <button id="btnT2B" class="on" onclick="setDir('t2b')">Text → Braille</button>
    <button id="btnB2T" onclick="setDir('b2t')">Braille → Text</button>
  </div>

  <div class="card">
    <label id="inLabel" for="input">Your text</label>
    <textarea id="input" placeholder="Type something…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  </div>

  <div class="card">
    <label>Braille</label>
    <div class="output empty" id="output">Translation appears here</div>
  </div>

  <div class="actions">
    <button class="btn primary" id="copyBtn" onclick="copyOut()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy
    </button>
    <button class="btn" onclick="clearAll()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Clear
    </button>
  </div>


  <p class="hint">Grade 1 (uncontracted) Braille · ⠠ marks capitals · ⠼ marks numbers</p>
</main>

<footer>Made for learners · Works offline</footer>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
let dir = "t2b";
const input = document.getElementById("input");
const output = document.getElementById("output");
const inLabel = document.getElementById("inLabel");
const copyBtn = document.getElementById("copyBtn");

function setDir(d){
  dir = d;
  document.getElementById("btnT2B").classList.toggle("on", d==="t2b");
  document.getElementById("btnB2T").classList.toggle("on", d==="b2t");
  inLabel.textContent = d==="t2b" ? "Your text" : "Braille";
  input.placeholder = d==="t2b" ? "Type something…" : "⠓⠑⠇⠇⠕";
  input.value = ""; translate();
  input.focus();
}
function translate(){
  const v = input.value;
  let r = dir==="t2b" ? textToBraille(v) : brailleToText(v);
  if(!r){ output.textContent = "Translation appears here"; output.classList.add("empty"); }
  else{ output.textContent = r; output.classList.remove("empty"); }
  copyBtn.disabled = !r;
}
function clearAll(){ input.value=""; translate(); input.focus(); }
function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 1600);
}
function copyOut(){
  const t = output.textContent;
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast("Copied")); }
  else{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copied"); }
}
input.addEventListener("input", translate);
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
